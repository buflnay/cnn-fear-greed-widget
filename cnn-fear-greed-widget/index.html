<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>CNN Fear & Greed · 개인용 노션 위젯</title>
<style>
:root{color-scheme:light;--ink:#242628;--muted:#77808b;--line:#e9eaed;--bg:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:800px;margin:auto;background:var(--bg);border:1px solid #e7e9ec;border-radius:18px;padding:18px 22px;box-shadow:0 2px 12px rgba(24,34,49,.03)}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:17px;line-height:1.35;margin:0;font-weight:720;letter-spacing:-.35px}.description{font-size:11px;color:var(--muted);margin:4px 0 0}
.small{font-size:10px;color:#8c939c} .status{font-size:10px;color:#69717b;border:1px solid #e8e9ef;border-radius:100px;padding:5px 9px;white-space:nowrap}
.content{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(180px,.8fr);gap:8px 16px;align-items:center;margin-top:10px}
.gauge{position:relative;min-width:0;aspect-ratio:440/295}.gauge svg{height:100%;width:100%;overflow:visible}
#needle{transition:transform .7s cubic-bezier(.22,.8,.28,1);transform-origin:220px 238px}
.gauge-center{position:absolute;top:67%;left:50%;transform:translate(-50%,-15%);text-align:center;white-space:nowrap}
.score{font-size:34px;line-height:1.02;font-weight:800;font-variant-numeric:tabular-nums;color:#1f2937}
.rating{font-size:12px;margin-top:4px;font-weight:650;letter-spacing:-.15px}
.recent{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.recent:last-child{border-bottom:none}.rec-label{font-size:11px;color:var(--muted)}.rec-score{font-size:16px;font-weight:750;font-variant-numeric:tabular-nums}
.date{font-size:10px;color:var(--muted);margin-top:10px}footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid #f0f1f3;margin-top:7px}
a{font-size:11px;color:#667080;text-decoration:none}a:hover{text-decoration:underline}.warning{font-size:10px;color:#a34836;margin-top:7px;display:none}
@media(max-width:520px){main{padding:13px 12px;border-radius:12px}.content{grid-template-columns:minmax(0,1fr);gap:0}.gauge{max-width:440px;width:100%;margin:0 auto}.recent-list{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.recent{padding:8px 0}.rec-score{font-size:14px} .score{font-size:29px}}
</style>
</head>
<body>
<main aria-label="CNN 공포 탐욕 지수 위젯">
 <header><div><h1>Fear & Greed Index</h1><div class="description">CNN 시장 심리지수 · 비공식 개인용 시각화</div></div><div class="status" id="status">데이터 확인 중</div></header>
 <div class="content">
  <div class="gauge">
   <svg viewBox="0 0 440 295" role="img" aria-label="공포 탐욕 0에서 100까지 반원형 게이지">
    <defs><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".08" /></filter></defs>
    <g fill="none" stroke-width="50" stroke-linecap="butt">
      <path d="M 54 238 A 166 166 0 0 1 87.4 138.2" stroke="#e74c3c"/>
      <path d="M 95.1 127.6 A 166 166 0 0 1 178.7 77.2" stroke="#f39c12"/>
      <path d="M 192.6 74.3 A 166 166 0 0 1 247.4 74.3" stroke="#f1c40f"/>
      <path d="M 261.3 77.2 A 166 166 0 0 1 344.9 127.6" stroke="#8bc34a"/>
      <path d="M 352.6 138.2 A 166 166 0 0 1 386 238" stroke="#27ae60"/>
    </g>
    <g fill="#58636d" font-size="12" font-weight="600" text-anchor="middle">
      <text x="63" y="112" transform="rotate(-56 63 112)">극도의 공포</text>
      <text x="138" y="74" transform="rotate(-26 138 74)">공포</text>
      <text x="220" y="43">중립</text>
      <text x="302" y="74" transform="rotate(26 302 74)">탐욕</text>
      <text x="378" y="112" transform="rotate(56 378 112)">극도의 탐욕</text>
    </g>
    <path d="M 82 238 A 138 138 0 0 1 358 238" fill="none" stroke="#ffffff" stroke-width="6" opacity=".72"/>
    <g fill="#88919a" font-size="12" text-anchor="middle"><text x="51" y="258">0</text><text x="127" y="116">25</text><text x="220" y="66">50</text><text x="313" y="116">75</text><text x="390" y="258">100</text></g>
    <g id="needle" style="transform:rotate(-90deg)">
     <path d="M 214 237 L 220 98 L 226 237 Z" fill="#2f3542" filter="url(#shadow)"/>
     <circle cx="220" cy="238" r="11" fill="#2f3542"/>
     <circle cx="220" cy="238" r="4.5" fill="#ffffff"/>
   </g>
   </svg>
   <div class="gauge-center"><div class="score" id="score">—</div><div class="rating" id="rating">데이터 대기</div></div>
  </div>
  <div><div class="recent-list">
    <div class="recent"><div class="rec-label">전일 종가</div><div class="rec-score" id="previous_close">—</div></div>
    <div class="recent"><div class="rec-label">1주 전</div><div class="rec-score" id="previous_1_week">—</div></div>
    <div class="recent"><div class="rec-label">1개월 전</div><div class="rec-score" id="previous_1_month">—</div></div>
    <div class="recent"><div class="rec-label">1년 전</div><div class="rec-score" id="previous_1_year">—</div></div>
  </div><div class="date" id="updated">갱신 정보가 없습니다.</div><div class="warning" id="warning">데이터 갱신이 지연될 수 있습니다. CNN 원본 수치를 확인하세요.</div></div>
 </div>
 <footer><div class="small">출처: CNN · 공식 위젯 아님</div><a href="https://www.cnn.com/markets/fear-and-greed" target="_blank" rel="noopener noreferrer">CNN 원본에서 확인 ↗</a></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const labels={"extreme fear":"극도의 공포","fear":"공포","neutral":"중립","greed":"탐욕","extreme greed":"극도의 탐욕"};
const fmt=x=>typeof x==='number'&&Number.isFinite(x)?Math.round(x).toString():'—';
(async function(){
 try{
  const response=await fetch('./data/latest.json?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('데이터 파일 요청 실패');
  const v=await response.json();
  if(typeof v.score!=='number'||!Number.isFinite(v.score)||v.score<0||v.score>100)throw new Error('지수 데이터 미확인');
  const val=Math.round(v.score);const rating=String(v.rating||'').toLowerCase();
  $('score').textContent=String(val);$('rating').textContent=labels[rating]||v.rating||'—';
  $('needle').style.transform='rotate('+(-90+1.8*val)+'deg)';
  ['previous_close','previous_1_week','previous_1_month','previous_1_year'].forEach(k=>{$(k).textContent=fmt(v[k])});
  $('status').textContent='CNN 데이터';
  const timestamp=v.timestamp?new Date(v.timestamp):null;
  if(timestamp&&!isNaN(timestamp.getTime())){
    $('updated').textContent='마지막 데이터 시각 · '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'medium',timeStyle:'short'}).format(timestamp);
    if(Date.now()-timestamp.getTime()>72*3600*1000){$('status').textContent='갱신 지연';$('warning').style.display='block'}
  }else $('updated').textContent='마지막 갱신 시각 미확인';
 }catch(error){$('status').textContent='연결 대기';$('updated').textContent='CNN 데이터가 아직 준비되지 않았습니다.';console.warn(error)}
})();
</script>
</body></html>
